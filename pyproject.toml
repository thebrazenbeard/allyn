[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allyn"
version = "0.1.0"
description = "Experimental, evidence-governed language learning and teaching research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
allyn = "allyn.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
